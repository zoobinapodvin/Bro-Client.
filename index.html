<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="description" content="BRO CLIENT — site de présentation."><title>BRO CLIENT</title><link rel="icon" href="/assets/logo.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--ink:#f5f5f6;--muted:#a0a1a8;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#080809;color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 48% 30%,#282b31 0,transparent 48%),#070708}.scene:before,.scene:after{content:"";position:absolute;inset:-80%;background:repeating-linear-gradient(118deg,#09090a 0%,#0b0c0f 5%,#34373d 8%,#6d727c 9%,#18191c 10.5%,#070708 15%,#08090a 22%);filter:blur(25px);opacity:.35;transform:rotate(-12deg);animation:sweep 22s ease-in-out infinite alternate}.scene:after{opacity:.14;transform:rotate(25deg);animation-direction:alternate-reverse}.veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#07070822,#070708bb 86%),linear-gradient(180deg,#07070888,transparent 28%,transparent 65%,#070708c9)}@keyframes sweep{to{transform:translate(10%,8%) rotate(8deg) scale(1.12)}}.shell{position:relative;isolation:isolate;min-height:100svh;width:min(1440px,100%);margin:auto;display:grid;grid-template-rows:auto 1fr auto;padding-inline:clamp(24px,5vw,76px)}header,footer{display:flex;justify-content:space-between;align-items:center;gap:15px}header{min-height:80px;border-bottom:1px solid var(--line)}header img{width:76px;height:auto;display:block}.label{font-size:10px;letter-spacing:.20em;color:var(--muted);font-weight:650;text-transform:uppercase}main{display:grid;place-content:center;justify-items:center;text-align:center;padding:42px 0 54px}.identity{width:min(650px,81vw);height:auto;filter:drop-shadow(0 12px 25px #000a);display:block;animation:enter .7s ease-out both}.caption{margin:24px 0 0;font-size:clamp(13px,1.5vw,18px);letter-spacing:.38em;font-weight:600;color:#bcbec5;text-transform:uppercase}.rule{width:46px;height:1px;background:linear-gradient(90deg,transparent,#a4a9b2,transparent);margin:25px 0}.sub{color:#a4a6ad;font-size:12px;letter-spacing:.08em;margin:0}footer{min-height:72px;border-top:1px solid var(--line);font-size:11px;color:#a0a1a8}footer a{transition:color .2s}footer a:hover{color:white}a:focus-visible{outline:2px solid #fff;outline-offset:6px}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.shell{padding-inline:24px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header{min-height:64px}header img{width:61px}.label{font-size:9px;letter-spacing:.13em}.identity{width:85vw;max-width:460px}.caption{letter-spacing:.28em;margin-top:17px}main{padding:35px 0}footer{min-height:62px;font-size:10px}.scene:before{filter:blur(15px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="scene" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div><div class="shell"><header><a href="/" aria-label="BRO CLIENT — Accueil"><img src="/assets/logo.svg" alt="BRO."></a><span class="label">BRO CLIENT</span></header><main><h1 style="margin:0"><img class="identity" src="/assets/logo.svg" alt="BRO CLIENT"></h1><p class="caption">BRO CLIENT</p><div class="rule" aria-hidden="true"></div><p class="sub">Site de présentation</p></main><footer><span>© 2026 BRO CLIENT</span><a href="/">broclient.com</a></footer></div></body></html>
